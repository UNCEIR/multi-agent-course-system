services:
  python-api:
    build:
      context: ./python
      dockerfile: Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    env_file:
      - ./python/.env
    environment:
      # 仅覆盖「容器网络相关」变量；LLM / Embedding / Milvus collection 等业务参数一律由 python/.env 决定，
      # 避免出现「容器静悄悄走回默认 collection / 默认 provider」的现象。
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=123456
      - MYSQL_DATABASE=course_system
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      # Phase 2：容器内走服务名访问共享 minio（密码统一 123456，与 mysql 一致）
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9002
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=12345678
      - MINIO_SECURE=false
    ports:
      - "8000:8000"
    # 2026-08-31：持久化 .documents（report 本地兜底产物 / report_uploads / mindmaps）。
    # 此前容器内本地兜底重建即丢，导致「生成 OK 但下载 404」；挂命名卷后重建不丢。
    volumes:
      - python_documents_data:/app/.documents
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy

  # 路 5：frontend 容器化 — 与 python-api 同 docker 网络（service 名寻址），绕开 host proxy 502 bug
  # 启动：`docker compose -f docker-compose.yml -f docker-compose.pull-mirror.yml --profile frontend up -d --build frontend`
  # 关闭：`docker compose --profile frontend stop`
  # ⚠️ host 上不要同时跑 `npm run dev`（端口冲突；且 SSE 流会被 docker desktop host → container:8000
  #    转发层截断为空 body，前端报 network error）
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 默认走 docker.io；不可达时同 python-api 模式传 build-arg：
        # NODE_BASE_IMAGE=docker.1ms.run/library/node:20-slim docker compose ... build --no-cache frontend
        # ⚠️ 改 frontend/package.json 后必须 --no-cache 重 build（否则镜像里的 package.json 是旧版）
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:20-slim}
    environment:
      # 容器内走 service 名直连 python-api（同 docker 网络，绕开 docker desktop host 转发层）
      - API_PROXY_TARGET=http://python-api:8000
      - NEXT_TELEMETRY_DISABLED=1
    ports:
      - "3001:3001"   # 容器内 `next dev -p 3001`（见 frontend/package.json scripts.dev），与端口映射对齐
    depends_on:
      python-api:
        condition: service_started

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=course_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_python_data:/var/lib/mysql
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_python_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health", "--endpoints=http://127.0.0.1:2379"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    # --address ":9002"：S3 API 端口（Milvus / 业务读写都连这个）
    # --console-address ":9003"：Web UI 端口（人看，浏览器访问）
    # 宿主 9000 端口被占用，故 API 改 9002；这两个端口不能相同（API 与 UI 是不同的 HTTP server）
    command: minio server /minio_data --address ":9002" --console-address ":9003"
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=12345678
    ports:
      - "9002:9002"  # API
      - "9003:9003"  # Console / UI
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.4.6
    command: ["milvus", "run", "standalone"]
    # Milvus v2.4.6 镜像识别的环境变量必须带 MILVUS_ 前缀；
    # 旧版 ETCD_ENDPOINTS / MINIO_ADDRESS 等不带前缀的变量被完全忽略。
    # yaml 挂载（./milvus.yaml → /milvus/configs/milvus.yaml）优先级高于环境变量，
    # 因此本块 env 主要起"显式声明 / 镜像默认值被覆盖后的可见性"作用。
    environment:
      - MILVUS_ETCD_ENDPOINTS=etcd:2379
      - MILVUS_MINIO_ADDRESS=minio
      - MILVUS_MINIO_PORT=9002
      - MILVUS_MINIO_ACCESSKEYID=minioadmin
      - MILVUS_MINIO_SECRETACCESSKEY=12345678
    # 仓库根目录 milvus.yaml（精简覆盖版）替代了原 ./python/configs/milvus.yaml；
    # 仅覆盖与镜像默认不同的字段，其余走镜像默认。
    volumes:
      - ./milvus.yaml:/milvus/configs/milvus.yaml
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # 9091 是 milvus metrics 端口，/healthz 是 v2.4.x 的 liveness 端点
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  mysql_python_data:
  redis_python_data:
  milvus_data:
  minio_data:
  etcd_data:
  python_documents_data:
