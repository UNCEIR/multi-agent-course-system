# 国内镜像覆盖（默认启用）：绕开 registry-1.docker.io 被墙导致的构建/拉取超时。
# - python-api 基础镜像 / mysql / redis / minio / milvus 走 DaoCloud（docker.m.daocloud.io）
# - frontend node 基础镜像走 docker.1ms.run（DaoCloud 对 node 镜像曾返回 401，故单独换源）
# 所有 up / build 命令统一带上本覆盖文件：
#
#   docker compose -f docker-compose.yml -f docker-compose.pull-mirror.yml up -d --build
#
# 可直连 Docker Hub 时去掉本文件即可回退官方源；亦可自行改前缀或配置 Docker Desktop 的
# registry-mirrors，不以本仓库为唯一方案。etcd 仍为 quay.io 官方镜像（DaoCloud 对
# quay/etcd 路径常返回 403，quay.io 一般可直连）。

services:
  python-api:
    build:
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim

  frontend:
    build:
      args:
        NODE_BASE_IMAGE: docker.1ms.run/library/node:20-slim

  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine

  # quay.io 经 DaoCloud 代理常返回 403，此处沿用官方镜像（通常可直连）
  etcd:
    image: quay.io/coreos/etcd:v3.5.14

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2024-05-10T01-41-38Z

  milvus:
    image: docker.m.daocloud.io/milvusdb/milvus:v2.4.6
